<div style="text-align: center; margin-top: 50px;">
  <h1>Login</h1>

  
  <form #homeform="ngForm" (ngSubmit)="onSubmit(homeform)">
    <mat-form-field appearance="fill">
      <mat-label>Username</mat-label>
      <input matInput type="text" name="username" ngModel required>
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput type="password" name="password" ngModel required>
    </mat-form-field>
    <br><br>
    <button mat-raised-button color="primary" type="submit" [disabled]="!homeform.valid">Invia</button>
  </form>

  <button mat-raised-button color="accent" type="button" routerLink="/signup">Registrati</button>
  <br><br>
</div>
