<mat-sidenav-container style="height: 100vh; background-color: #f4f7fa;">
  <mat-sidenav mode="side" opened style="width: 260px; background-color: #0f172a; color: white; border-right: none; box-shadow: 2px 0 10px rgba(0,0,0,0.1); overflow: hidden; border-radius: 0;">
    <div style="padding: 30px 20px; text-align: center; border-bottom: 1px solid #1e293b; margin-bottom: 20px;">
      <h2 style="margin: 0; font-weight: 700; font-size: 22px; color: #ffffff; letter-spacing: 1px;">MENU</h2>
    </div>

    <mat-nav-list style="overflow: hidden;">
      <a mat-list-item routerLink="timesheet" routerLinkActive="active-link" style="color: #cbd5e1; border-radius: 8px; margin: 0 15px;">
        <span matListItemTitle style="font-weight: 500; font-size: 15px;">Il Mio Timesheet</span>
      </a>
    </mat-nav-list>

    <div style="position: absolute; bottom: 30px; width: 100%; padding: 0 20px; box-sizing: border-box;">
      <button mat-flat-button style="width: 100%; background-color: #1e293b; color: #ffffff; border-radius: 8px; padding: 10px 0; font-weight: 600;" (click)="onLogout()">
        <mat-icon style="margin-right: 10px;"></mat-icon> Esci
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content style="overflow: auto; scrollbar-width: none; -ms-overflow-style: none;">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
